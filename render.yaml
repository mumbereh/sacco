databases:
  - name: banking-system-db
    plan: free
    databaseName: banking_system_production
    user: banking_system

services:
  - type: web
    name: banking-system-backend
    env: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banking-system-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
        key: WEB_CONCURRENCEY
        value: 2 
